# fdroiddata recipe. Copy to fdroiddata as
# metadata/com.thomaspeoples.wraithodysseus.yml for the one merge request;
# CI runs `fdroid lint` on this file (bin/fdroid-lint.sh).
#
# After that MR, releases need nothing by hand: F-Droid's checkupdates finds
# each new android-* tag, reads the literal versionCode/versionName in
# app/build.gradle.kts at that tag, and appends a build. Listing text,
# screenshots and per-versionCode changelogs come from fastlane/, which
# bin/fdroid-bump.py keeps in step on every commitizen bump.
#
# Reproducible: F-Droid checks its build against the APK on the Gitea
# release (Binaries) and ships that APK with this project's signature
# (AllowedAPKSigningKeys). So no build flags here -- any flag would make a
# different APK. The update check turns itself off at runtime when an
# F-Droid client installed the app (UpdateChecker.enabled).
#
# fdroiddata wants no comments and a full commit hash, not a tag: the MR copy
# is this file run through `fdroid rewritemeta` with commit resolved.
# Submitted as https://gitlab.com/fdroid/fdroiddata/-/merge_requests/51956;
# after it merges, fdroiddata's copy is the live one and this is reference.

