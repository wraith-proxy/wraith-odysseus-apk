# fdroiddata recipe. Copy to fdroiddata as
# metadata/com.thomaspeoples.wraithodysseus.yml for the one merge request;
# CI runs `fdroid lint` on this file (bin/fdroid-lint.sh).
#
# After that MR, releases need nothing by hand: F-Droid's checkupdates finds
# each new android-* tag, reads the literal versionCode/versionName in
# app/build.gradle.kts at that tag, and appends a build. Listing text,
# screenshots and per-versionCode changelogs come from fastlane/, which
# bin/fdroid-bump.py keeps in step on every commitizen bump.
#
# Left out until builds are reproducible (see docs/ROADMAP.md):
# AllowedAPKSigningKeys / Binaries. Until then F-Droid signs with its key.

Categories:
  - AI Chat
  - Email
License: MIT
AuthorName: Thomas Peoples
WebSite: https://git.thomaspeoples.com/thomaspeoples/wraith-odysseus-apk
SourceCode: https://git.thomaspeoples.com/thomaspeoples/wraith-odysseus-apk
IssueTracker: https://git.thomaspeoples.com/thomaspeoples/wraith-odysseus-apk/issues
Changelog: https://git.thomaspeoples.com/thomaspeoples/wraith-odysseus-apk/src/branch/main/CHANGELOG.md

AutoName: Wraith for Odysseus

RepoType: git
Repo: https://git.thomaspeoples.com/thomaspeoples/wraith-odysseus-apk.git

Builds:
  - versionName: 0.2.0
    versionCode: 200
    commit: android-0.2.0
    subdir: app
    gradle:
      - yes
    # Compiles out the launch-time Gitea update check: F-Droid ships the
    # updates itself, and the build then contacts only the user's server.
    gradleprops:
      - updateCheck=false

AutoUpdateMode: Version
UpdateCheckMode: Tags ^android-[0-9.]+$
CurrentVersion: 0.2.0
CurrentVersionCode: 200
